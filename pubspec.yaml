name: my_eyes
description: An offline educational color vision simulator.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  camera: ^0.12.2
  app_settings: ^9.0.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.3
  image: ^4.5.4
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/scenes/
  shaders:
    - shaders/vision.frag
