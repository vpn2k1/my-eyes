name: my_eyes
description: An offline educational color vision simulator.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  camera: ^0.12.2
  app_settings: ^9.0.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.3
  image: ^4.5.4
  url_launcher: ^6.3.2
  upgrader: ^14.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter_launcher_icons:
  image_path: assets/branding/icon_master.png
  android: true
  adaptive_icon_background: "#141E35"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#141E35"
    theme_color: "#141E35"
flutter_native_splash:
  color: "#141E35"
  color_dark: "#141E35"
  image: assets/branding/splash_logo.png
  image_dark: assets/branding/splash_logo.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#141E35"
    color_dark: "#141E35"
    image: assets/branding/splash_android12.png
    image_dark: assets/branding/splash_android12.png
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/scenes/
    - assets/branding/logo.png
    - shorebird.yaml
  shaders:
    - shaders/vision.frag
